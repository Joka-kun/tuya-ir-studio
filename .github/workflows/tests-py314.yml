name: Python 3.14 compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14 and JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install pytest pytest-asyncio voluptuous segno==1.6.6
      - run: python -m pytest -q tests
      - run: python -m compileall -q custom_components/ir_studio
      - run: node --check custom_components/ir_studio/frontend/panel.js
      - run: node tests/test_local_only_ui.js
      - run: node tests/test_profile_picker.js
      - run: node tests/test_sidebar_icon_layout.js
      - run: node tests/test_profile_reordering.js
      - run: node tests/test_inline_learning.js
      - run: node tests/test_projector_ui.js
      - run: node tests/test_placeholder_cleanup.js
      - run: node tests/test_ir_file_ui.js
      - run: node tests/test_guided_learning.js
      - run: node tests/test_restored_progress.js
      - run: node tests/test_backup_executor_ui.js
      - run: node tests/test_qr_copy.js
